name: telesrv

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    command:  
      - "postgres"
      - "-c"
      - "max_locks_per_transaction=512"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "track_io_timing=on"
    environment:
      POSTGRES_DB: telesrv
      POSTGRES_USER: telesrv
      POSTGRES_PASSWORD: telesrv
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telesrv -d telesrv"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: telesrv-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6399:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  telesrv:
    build:
      context: .
      dockerfile: Dockerfile
      target: telesrv
      args:
        GO_VERSION: "1.26"
    container_name: telesrv-server
    image: telesrv-server:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TELESRV_LISTEN: "0.0.0.0:2398"
      TELESRV_ADVERTISE_IP: "31.77.159.85"
      TELESRV_DEFAULT_COUNTRY_CODE: "RU"
      TELESRV_POSTGRES_DSN: "postgres://telesrv:telesrv@postgres:5432/telesrv?sslmode=disable"
      TELESRV_REDIS_ADDR: "redis:6379"
      TELESRV_BLOB_DIR: "/app/data/blobs"
      TELESRV_OFFICIAL_GIFTS_DIR: "/app/official-gifts"
      TELESRV_STICKER_SEED_DIR: "/app/data/sticker-seed"
      TELESRV_SYSTEM_AVATAR_PATH: "/app/downloads/FromGram.png"
      TELESRV_ADMIN_UI_ADDR: "0.0.0.0:2600"
      TELESRV_ADMIN_API_ADDR: "0.0.0.0:2599"
      
      TELESRV_SERVER_NAME: "SummerGram"
      
      TELESRV_ADMIN_API_TOKEN: "14881488"
      TELESRV_ADMIN_UI_PASSWORD: "14881488"
      TELESRV_ADMIN_SESSION_KEY: "14881488_secret_key"
      
      TELESRV_PHONE_CODE_DELIVERY_PROVIDER: "webhook"
      TELESRV_OTP_WEBHOOK_URL: "http://auth-bot:8080/"
      
      # Отключаем WebSocket для работы обычного TCP
      TELESRV_WEBSOCKET_ENABLE: "false"
      
      TELESRV_DEBUG: "true"
    volumes:
      - appdata:/app/data
    ports:
      - "2398:2398"
      - "2599:2599"
    restart: unless-stopped

  telesrv-admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
      args:
        GO_VERSION: "1.26"
    container_name: telesrv-admin
    image: telesrv-admin:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      telesrv:
        condition: service_started
    environment:
      TELESRV_ADMIN_UI_ADDR: "0.0.0.0:2600"
      TELESRV_ADMIN_API_ADDR: "http://telesrv:2599"
      TELESRV_ADMIN_API_TOKEN: "14881488"
      TELESRV_ADMIN_UI_PASSWORD: "14881488"
      TELESRV_ADMIN_SESSION_KEY: "14881488_secret_key"
      TELESRV_POSTGRES_DSN: "postgres://telesrv:telesrv@postgres:5432/telesrv?sslmode=disable"
      TELESRV_REDIS_ADDR: "redis:6379"
    volumes:
      - appdata:/app/data
    ports:
      - "2600:2600"
    restart: unless-stopped

  auth-bot:
    build:
      context: ./bot
    container_name: auth-bot
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  appdata:
